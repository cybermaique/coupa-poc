<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Intelligent Buy | Coupa Launcher</title>
    <script src="launcher.config.js"></script>
    <style>
      :root {
        --brand-navy: #002060;
        --brand-blue: #0b4da2;
        --brand-blue-soft: #dcecff;
        --brand-orange: #e96a15;
        --surface: #ffffff;
        --surface-muted: #f5f8fc;
        --border: #c8d6e8;
        --text: #172033;
        --muted: #5f6f86;
        --disabled: #94a3b8;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: var(--text);
        background:
          linear-gradient(90deg, rgba(0, 32, 96, 0.92) 0 22%, transparent 22% 78%, rgba(0, 32, 96, 0.92) 78% 100%),
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.08) 0 1px,
            transparent 1px 18px
          ),
          #063b80;
      }

      .page {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 12px;
      }

      .panel {
        display: grid;
        width: min(100%, 690px);
        min-height: 204px;
        grid-template-columns: minmax(0, 1.1fr) minmax(220px, 0.9fr);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 18px 42px rgba(0, 18, 54, 0.24);
      }

      .intro {
        padding: 22px 24px;
        background:
          linear-gradient(180deg, rgba(220, 236, 255, 0.88), rgba(255, 255, 255, 0)),
          var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        background: var(--brand-navy);
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0;
      }

      .brand-name {
        margin: 0;
        color: var(--brand-navy);
        font-size: 1rem;
        font-weight: 850;
        letter-spacing: 0;
      }

      .language-switcher {
        display: inline-grid;
        grid-template-columns: repeat(3, 34px);
        justify-self: end;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
      }

      .language-button {
        display: inline-flex;
        width: 34px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0;
        cursor: pointer;
      }

      .language-button:hover {
        background: var(--brand-blue-soft);
        color: var(--brand-navy);
      }

      .language-button[aria-pressed='true'] {
        background: var(--brand-navy);
        color: #ffffff;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 7px;
        color: var(--brand-orange);
        font-size: 0.66rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        display: block;
        width: 18px;
        height: 2px;
        content: '';
        background: currentColor;
      }

      .headline {
        margin: 0;
        color: var(--brand-navy);
        font-size: 1.35rem;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .description {
        max-width: 330px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .reference-diagnostic {
        max-width: 330px;
        margin: 10px 0 0;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-muted);
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .reference-diagnostic[data-state='unavailable'] {
        border-color: #fecdca;
        color: #b42318;
      }

      .actions {
        display: grid;
        align-items: center;
        padding: 22px;
        background: var(--surface-muted);
        border-left: 1px solid var(--border);
      }

      .actions-content {
        display: grid;
        width: 100%;
        align-content: center;
        gap: 12px;
        transform: translateY(-4px);
      }

      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 850;
        letter-spacing: 0;
        cursor: pointer;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.72;
      }

      .button-primary {
        color: #ffffff;
        background: var(--brand-navy);
        box-shadow: 0 12px 26px rgba(0, 32, 96, 0.24);
      }

      .button-primary:hover:not(:disabled) {
        background: #00184a;
      }

      .button-secondary {
        color: var(--brand-navy);
        background: #ffffff;
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .button-secondary:hover:not(:disabled) {
        background: var(--brand-blue-soft);
      }

      .status {
        min-height: 18px;
        margin: -4px 0 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
        text-align: center;
      }

      .status[data-state='error'] {
        color: #b42318;
      }

      @media (max-width: 620px), (max-height: 250px) {
        .page {
          align-items: start;
          padding: 8px;
        }

        .panel {
          min-height: 0;
          grid-template-columns: 1fr;
        }

        .intro {
          padding: 14px 16px 10px;
        }

        .language-switcher {
          grid-template-columns: repeat(3, 30px);
          grid-column: 1 / -1;
          justify-self: end;
        }

        .language-button {
          width: 30px;
          height: 26px;
          font-size: 0.68rem;
        }

        .eyebrow {
          margin-top: 10px;
        }

        .headline {
          font-size: 1.1rem;
        }

        .description {
          display: none;
        }

        .actions {
          padding: 10px 16px 14px;
          border-top: 1px solid var(--border);
          border-left: 0;
        }

        .actions-content {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          transform: none;
        }

        .button {
          min-height: 40px;
          padding: 0 10px;
          font-size: 0.82rem;
        }

        .status {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="page-title">
        <div class="intro">
          <div class="brand" aria-label="Intelligent Buy">
            <div class="brand-mark" aria-hidden="true">IB</div>
            <p class="brand-name">Intelligent Buy</p>
          </div>
          <span class="eyebrow" data-i18n="eyebrow">SmartMap Coupa</span>
          <h1 class="headline" id="page-title" data-i18n="headline">Abrir no Intelligent Buy</h1>
          <p class="reference-diagnostic" id="reference-diagnostic" aria-live="polite"></p>
          <p class="description" data-i18n="description">
            Use o objeto da requisição Coupa para acessar o Mapa ou o Resumo em uma nova aba.
          </p>
        </div>

        <div class="actions" aria-label="Ações disponíveis" data-i18n-aria-label="actionsLabel">
          <div class="actions-content">
            <div class="language-switcher" aria-label="Selecionar idioma">
              <button class="language-button" type="button" data-language="pt" aria-pressed="false">PT</button>
              <button class="language-button" type="button" data-language="en" aria-pressed="false">EN</button>
              <button class="language-button" type="button" data-language="es" aria-pressed="false">ES</button>
            </div>
            <button class="button button-primary" type="button" data-destination="map" data-i18n="mapButton">
              Abrir Mapa
            </button>
            <button class="button button-secondary" type="button" data-destination="summary" data-i18n="summaryButton">
              Abrir Resumo
            </button>
            <p class="status" id="status" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        const DEFAULT_CONFIG = {
          appBaseUrl: 'https://uintelligentbuy.hml.stratesys.io',
          mapPath: '/admin/maps',
          summaryPath: '/admin/review/quotation',
        };

        const config = Object.assign({}, DEFAULT_CONFIG, window.COUPA_LAUNCHER_CONFIG || {});
        const status = document.getElementById('status');
        const referenceDiagnostic = document.getElementById('reference-diagnostic');
        const destinationButtons = document.querySelectorAll('[data-destination]');
        const languageButtons = document.querySelectorAll('[data-language]');
        const supportedLanguages = ['pt', 'en', 'es'];
        let currentLanguage = resolveBrowserLanguage();
        let currentStatusKey = '';
        let currentStatusState = '';

        const translations = {
          pt: {
            pageTitle: 'Intelligent Buy | Launcher Coupa',
            languageLabel: 'Selecionar idioma',
            eyebrow: 'SmartMap Coupa',
            headline: 'Abrir no Intelligent Buy',
            description: 'Use o objeto da requisição Coupa para acessar o Mapa ou o Resumo em uma nova aba.',
            actionsLabel: 'Ações disponíveis',
            mapButton: 'Abrir Mapa',
            summaryButton: 'Abrir Resumo',
            missingObjectId: 'ID do objeto Coupa não recebido.',
          },
          en: {
            pageTitle: 'Intelligent Buy | Coupa Launcher',
            languageLabel: 'Select language',
            eyebrow: 'SmartMap Coupa',
            headline: 'Open in Intelligent Buy',
            description: 'Use the Coupa request object to open the Map or Summary in a new tab.',
            actionsLabel: 'Available actions',
            mapButton: 'Open Map',
            summaryButton: 'Open Summary',
            missingObjectId: 'Coupa object ID was not received.',
          },
          es: {
            pageTitle: 'Intelligent Buy | Lanzador Coupa',
            languageLabel: 'Seleccionar idioma',
            eyebrow: 'SmartMap Coupa',
            headline: 'Abrir en Intelligent Buy',
            description: 'Use el objeto de la solicitud Coupa para acceder al Mapa o al Resumen en una nueva pestaña.',
            actionsLabel: 'Acciones disponibles',
            mapButton: 'Abrir Mapa',
            summaryButton: 'Abrir Resumen',
            missingObjectId: 'No se recibió el ID del objeto Coupa.',
          },
        };

        function normalizeValue(value) {
          const normalized = value ? String(value).trim() : '';
          return normalized || '';
        }

        function resolveBrowserLanguage() {
          const browserLanguages = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || 'pt'];
          const language = browserLanguages
            .map(function (value) {
              return String(value).slice(0, 2).toLowerCase();
            })
            .find(function (value) {
              return supportedLanguages.includes(value);
            });

          return language || 'pt';
        }

        function translate(key) {
          return translations[currentLanguage][key] || translations.pt[key] || '';
        }

        function applyLanguage(language) {
          currentLanguage = supportedLanguages.includes(language) ? language : 'pt';
          document.documentElement.lang = currentLanguage === 'pt' ? 'pt-BR' : currentLanguage;
          document.title = translate('pageTitle');

          document.querySelectorAll('[data-i18n]').forEach(function (element) {
            element.textContent = translate(element.dataset.i18n);
          });

          document.querySelectorAll('[data-i18n-aria-label]').forEach(function (element) {
            element.setAttribute('aria-label', translate(element.dataset.i18nAriaLabel));
          });

          document.querySelector('.language-switcher').setAttribute('aria-label', translate('languageLabel'));

          languageButtons.forEach(function (button) {
            const isActive = button.dataset.language === currentLanguage;
            button.setAttribute('aria-pressed', String(isActive));
          });

          if (currentStatusKey) {
            status.textContent = translate(currentStatusKey);
          }

          renderReferenceDiagnostic();
        }

        function getIncomingQueryParams() {
          return new URLSearchParams(window.location.search);
        }

        function getPublicReferenceFromReferrer() {
          const referrer = normalizeValue(document.referrer);
          const match = referrer.match(/\/quotes\/requests\/([^\/?#]+)(?:\/|$)/i);
          return match ? match[1] : '';
        }

        function renderReferenceDiagnostic() {
          const objectId = normalizeValue(getIncomingQueryParams().get('object_id'));
          const publicReference = getPublicReferenceFromReferrer();

          if (publicReference) {
            referenceDiagnostic.textContent = 'Referência pública detectada: ' + publicReference;
            referenceDiagnostic.dataset.state = 'detected';
          } else if (objectId) {
            referenceDiagnostic.textContent = 'Referência pública não recebida pelo iframe. ID técnico recebido: ' + objectId + '.';
            referenceDiagnostic.dataset.state = 'unavailable';
          } else {
            referenceDiagnostic.textContent = 'Referência pública não recebida pelo iframe.';
            referenceDiagnostic.dataset.state = 'unavailable';
          }

          console.info('[Coupa launcher] Diagnóstico da referência pública', {
            iframeUrl: window.location.href,
            iframeOrigin: window.location.origin,
            referrer: document.referrer || '(não informado)',
            technicalObjectId: objectId || '(não recebido)',
            detectedPublicReference: publicReference || '(não recebida)',
          });

          try {
            console.info('[Coupa launcher] URL da página-pai:', window.parent.location.href);
          } catch (error) {
            console.warn('[Coupa launcher] A URL da página-pai não pode ser lida por cross-origin.', error.name);
          }
        }

        function getNormalizedQueryParams() {
          const params = getIncomingQueryParams();
          const coupaObjectId = normalizeValue(params.get('object_id'));

          if (coupaObjectId) {
            ['projectId', 'eventId', 'negotiationCode'].forEach(function (key) {
              if (!normalizeValue(params.get(key))) {
                params.set(key, coupaObjectId);
              }
            });
          }

          return params;
        }

        function resolveTemplate(path, params) {
          return path.replace(/\{([^}]+)\}/g, function (_, key) {
            return encodeURIComponent(params.get(key) || '');
          });
        }

        function buildDestinationUrl(path) {
          const outgoingParams = getNormalizedQueryParams();
          const destination = new URL(resolveTemplate(path, outgoingParams), config.appBaseUrl);

          outgoingParams.forEach(function (value, key) {
            destination.searchParams.set(key, value);
          });

          return destination.toString();
        }

        function setStatus(messageKey, state) {
          currentStatusKey = messageKey;
          currentStatusState = state || '';
          status.textContent = translate(messageKey);
          status.dataset.state = state || '';
        }

        function validateRequiredParams() {
          const params = getNormalizedQueryParams();
          const projectId = normalizeValue(params.get('projectId'));

          if (projectId) return true;

          destinationButtons.forEach(function (button) {
            button.disabled = true;
          });
          setStatus('missingObjectId', 'error');
          return false;
        }

        function openDestination(destinationType) {
          if (!validateRequiredParams()) return;

          const path = destinationType === 'summary' ? config.summaryPath : config.mapPath;
          const url = buildDestinationUrl(path);

          // Nota: window.open com 'noopener' retorna null em browsers modernos por segurança,
          // tornando a detecção de popup bloqueado não confiável.
          window.open(url, '_blank', 'noopener,noreferrer');
        }

        destinationButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            openDestination(button.dataset.destination);
          });
        });

        languageButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            applyLanguage(button.dataset.language);
          });
        });

        applyLanguage(currentLanguage);
        validateRequiredParams();
      })();
    </script>
  </body>
</html>
