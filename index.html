<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Intelligent Buy | Coupa Launcher</title>
    <script src="launcher.config.js"></script>
    <style>
      :root {
        --brand-navy: #002060;
        --brand-blue: #0b4da2;
        --brand-blue-soft: #dcecff;
        --brand-orange: #e96a15;
        --surface: #ffffff;
        --surface-muted: #f5f8fc;
        --border: #c8d6e8;
        --text: #172033;
        --muted: #5f6f86;
        --disabled: #94a3b8;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: var(--text);
        background:
          linear-gradient(90deg, rgba(0, 32, 96, 0.92) 0 22%, transparent 22% 78%, rgba(0, 32, 96, 0.92) 78% 100%),
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.08) 0 1px,
            transparent 1px 18px
          ),
          #063b80;
      }

      .page {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 12px;
      }

      .panel {
        display: grid;
        width: min(100%, 690px);
        min-height: 204px;
        grid-template-columns: minmax(0, 1.1fr) minmax(220px, 0.9fr);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 18px 42px rgba(0, 18, 54, 0.24);
      }

      .intro {
        padding: 22px 24px;
        background:
          linear-gradient(180deg, rgba(220, 236, 255, 0.88), rgba(255, 255, 255, 0)),
          var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        background: var(--brand-navy);
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0;
      }

      .brand-name {
        margin: 0;
        color: var(--brand-navy);
        font-size: 1rem;
        font-weight: 850;
        letter-spacing: 0;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 7px;
        color: var(--brand-orange);
        font-size: 0.66rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        display: block;
        width: 18px;
        height: 2px;
        content: '';
        background: currentColor;
      }

      .headline {
        margin: 0;
        color: var(--brand-navy);
        font-size: 1.35rem;
        line-height: 1.18;
        letter-spacing: 0;
      }

      .description {
        max-width: 330px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .actions {
        display: grid;
        align-content: center;
        gap: 12px;
        padding: 22px;
        background: var(--surface-muted);
        border-left: 1px solid var(--border);
      }

      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 850;
        letter-spacing: 0;
        cursor: pointer;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.72;
      }

      .button-primary {
        color: #ffffff;
        background: var(--brand-navy);
        box-shadow: 0 12px 26px rgba(0, 32, 96, 0.24);
      }

      .button-primary:hover:not(:disabled) {
        background: #00184a;
      }

      .button-secondary {
        color: var(--brand-navy);
        background: #ffffff;
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .button-secondary:hover:not(:disabled) {
        background: var(--brand-blue-soft);
      }

      .status {
        min-height: 18px;
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
        text-align: center;
      }

      .status[data-state='error'] {
        color: #b42318;
      }

      @media (max-width: 620px), (max-height: 250px) {
        .page {
          align-items: start;
          padding: 8px;
        }

        .panel {
          min-height: 0;
          grid-template-columns: 1fr;
        }

        .intro {
          padding: 14px 16px 10px;
        }

        .eyebrow {
          margin-top: 10px;
        }

        .headline {
          font-size: 1.1rem;
        }

        .description {
          display: none;
        }

        .actions {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          padding: 10px 16px 14px;
          border-top: 1px solid var(--border);
          border-left: 0;
        }

        .button {
          min-height: 40px;
          padding: 0 10px;
          font-size: 0.82rem;
        }

        .status {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="page-title">
        <div class="intro">
          <div class="brand" aria-label="Intelligent Buy">
            <div class="brand-mark" aria-hidden="true">IB</div>
            <p class="brand-name">Intelligent Buy</p>
          </div>
          <span class="eyebrow">SmartMap Coupa</span>
          <h1 class="headline" id="page-title">Abrir no Intelligent Buy</h1>
          <p class="description">
            Use o objeto da requisição Coupa para acessar o Mapa ou o Resumo em uma nova aba.
          </p>
        </div>

        <div class="actions" aria-label="Ações disponíveis">
          <button class="button button-primary" type="button" data-destination="map">
            Abrir Mapa
          </button>
          <button class="button button-secondary" type="button" data-destination="summary">
            Abrir Resumo
          </button>
          <p class="status" id="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script>
      (function () {
        const DEFAULT_CONFIG = {
          appBaseUrl: 'https://uintelligentbuy.hml.stratesys.io',
          mapPath: '/admin/maps',
          summaryPath: '/admin/review/quotation',
        };

        const config = Object.assign({}, DEFAULT_CONFIG, window.ARIBA_LAUNCHER_CONFIG || {});
        const status = document.getElementById('status');
        const destinationButtons = document.querySelectorAll('[data-destination]');

        function normalizeValue(value) {
          const normalized = value ? String(value).trim() : '';
          return normalized || '';
        }

        function getIncomingQueryParams() {
          return new URLSearchParams(window.location.search);
        }

        function getNormalizedQueryParams() {
          const params = getIncomingQueryParams();
          const coupaObjectId = normalizeValue(params.get('object_id'));

          if (coupaObjectId) {
            ['projectId', 'eventId', 'negotiationCode'].forEach(function (key) {
              if (!normalizeValue(params.get(key))) {
                params.set(key, coupaObjectId);
              }
            });
          }

          return params;
        }

        function resolveTemplate(path, params) {
          return path.replace(/\{([^}]+)\}/g, function (_, key) {
            return encodeURIComponent(params.get(key) || '');
          });
        }

        function buildDestinationUrl(path) {
          const outgoingParams = getNormalizedQueryParams();
          const destination = new URL(resolveTemplate(path, outgoingParams), config.appBaseUrl);

          outgoingParams.forEach(function (value, key) {
            destination.searchParams.set(key, value);
          });

          return destination.toString();
        }

        function setStatus(message, state) {
          status.textContent = message;
          status.dataset.state = state || '';
        }

        function validateRequiredParams() {
          const params = getNormalizedQueryParams();
          const projectId = normalizeValue(params.get('projectId'));

          if (projectId) return true;

          destinationButtons.forEach(function (button) {
            button.disabled = true;
          });
          setStatus('ID do objeto Coupa não recebido.', 'error');
          return false;
        }

        function openDestination(destinationType) {
          if (!validateRequiredParams()) return;

          const path = destinationType === 'summary' ? config.summaryPath : config.mapPath;
          const url = buildDestinationUrl(path);

          // Nota: window.open com 'noopener' retorna null em browsers modernos por segurança,
          // tornando a detecção de popup bloqueado não confiável. Abrimos e assumimos sucesso.
          window.open(url, '_blank', 'noopener,noreferrer');
          setStatus('Nova aba solicitada com sucesso.');
        }

        destinationButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            openDestination(button.dataset.destination);
          });
        });

        validateRequiredParams();
      })();
    </script>
  </body>
</html>
